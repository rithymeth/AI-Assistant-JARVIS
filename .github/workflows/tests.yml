name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 pydantic==2.10.4 python-dotenv==1.0.1
      - name: Run unit tests
        env:
          DB_PATH: /tmp/javi-test.db
        run: python -m unittest discover -s tests -v
